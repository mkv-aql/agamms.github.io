  <main class="container">
    <section>
      <h2 data-en="Overview" data-de="Überblick"></h2>
      <p data-en="Building an autonomous survey drone system: the drone flies missions (travel to area, then scan at lower speed), uses an onboard camera and companion computer for vision and optional ML inference, and geotags detections using the flight controller position. Work covers both simulation (PX4 SITL, Gazebo, ROS 2, camera bridge, OpenCV) and real hardware (Pixhawk 6C stack, companion computer, camera)."
         data-de="Aufbau eines autonomen Survey-Drohnensystems: Die Drohne fliegt Missionen (Anflug, dann Scan mit geringerer Geschwindigkeit), nutzt eine Onboard-Kamera und einen Companion-Computer für Vision und optionale ML-Inferenz und geotaggt Detektionen über die Flugregler-Position. Die Arbeit umfasst Simulation (PX4 SITL, Gazebo, ROS 2, Kamerabridge, OpenCV) und reale Hardware (Pixhawk-6C-Stack, Companion-Computer, Kamera)."></p>
      <p data-en="Target specs: &lt;1 kg take-off weight, &lt;500 mm size, 6 m/s scan / 10 m/s travel. Skills involved: <strong>computer vision</strong>, <strong>ROS&nbsp;2</strong>, <strong>PX4</strong>, <strong>mechanical/hardware integration</strong>."
         data-de="Ziel-Spezifikationen: &lt;1 kg Startgewicht, &lt;500 mm Größe, 6 m/s Scan / 10 m/s Anflug. Relevante Skills: <strong>Computer Vision</strong>, <strong>ROS&nbsp;2</strong>, <strong>PX4</strong>, <strong>mechanische/Hardware-Integration</strong>."></p>
    </section>

    <section>
      <h2 data-en="Focus" data-de="Schwerpunkte"></h2>
      <ul>
        <li data-en="Simulation: PX4 SITL, Gazebo, custom model with camera, ROS 2 bridge, OpenCV on camera stream"
            data-de="Simulation: PX4 SITL, Gazebo, eigenes Modell mit Kamera, ROS-2-Bridge, OpenCV auf Kamerastream"></li>
        <li data-en="Hardware: Pixhawk 6C, companion computer (Raspberry Pi / Jetson), camera, optional depth sensor"
            data-de="Hardware: Pixhawk 6C, Companion-Computer (Raspberry Pi / Jetson), Kamera, optional Tiefensensor"></li>
        <li data-en="Software: ROS 2 (camera, OpenCV/ML, geotagging with PX4 position)"
            data-de="Software: ROS 2 (Kamera, OpenCV/ML, Geotagging mit PX4-Position)"></li>
      </ul>
    </section>

      <section>
  <h2 data-en="Current Progress" data-de="Aktueller Stand"></h2>

  <p data-en="Current milestone: a working PX4 SITL and Gazebo simulation with a custom camera-equipped x500 drone, QGroundControl monitoring, ROS 2 image transport, and OpenCV edge detection on the simulated camera stream. In parallel, real aerial footage and image samples are being collected from a palm oil farm environment to support future training data preparation and field validation."
     data-de="Aktueller Meilenstein: eine funktionierende PX4-SITL- und Gazebo-Simulation mit einer eigenen kamerabestückten x500-Drohne, QGroundControl-Monitoring, ROS-2-Bildübertragung und OpenCV-Edge-Detection auf dem simulierten Kamerastream. Parallel dazu werden reale Luftaufnahmen und Bildbeispiele aus einer Palmöl-Farmumgebung gesammelt, um zukünftige Trainingsdatenaufbereitung und Validierung im Feld zu unterstützen."></p>

  <ul>
    <li data-en="Created a custom Gazebo x500 drone model with onboard camera support."
        data-de="Eigenes Gazebo-x500-Drohnenmodell mit Onboard-Kamera-Unterstützung erstellt."></li>

    <li data-en="Connected PX4 SITL, Gazebo, QGroundControl, and ROS 2 into one simulation workflow."
        data-de="PX4 SITL, Gazebo, QGroundControl und ROS 2 in einem Simulationsworkflow verbunden."></li>

    <li data-en="Published camera-based OpenCV edge detection through ROS 2 for perception testing."
        data-de="Kamerabasierte OpenCV-Edge-Detection über ROS 2 für Perception-Tests veröffentlicht."></li>

    <li data-en="Tested takeoff and hover behavior in a tree-based survey environment."
        data-de="Takeoff- und Hover-Verhalten in einer baumbasierten Survey-Umgebung getestet."></li>

    <li data-en="Started collecting real aerial footage and image samples from a palm oil farm environment for future vision model training and validation."
        data-de="Mit der Sammlung realer Luftaufnahmen und Bilddaten aus einer Palmöl-Farmumgebung für zukünftiges Vision-Model-Training und Validierung begonnen."></li>
  </ul>
</section>
