    <h1 data-en="Doorbell name data acquisition and cleaner pipeline"
        data-de="Klingelschild-Namensdaten-Erfassung und Bereinigungspipeline"></h1>
    <p data-en="Computer vision pipeline for digitizing doorbell nameplates"
       data-de="Computer-Vision-Pipeline zur Digitalisierung von Klingelschildern"></p>

    <nav class="breadcrumb">
      <a href="index.html" class="btn" data-en="Back to Home" data-de="Zurück zum Start"></a>

  <main class="container">
    <section>
      <h2 data-en="Overview" data-de="Überblick"></h2>
      <p data-en="This project is a desktop pipeline for acquiring and cleaning name data from doorbell nameplate photos (e.g. building entrances, mailbox panels). It loads images of nameplates, runs OCR (EasyOCR) to detect resident names, displays results as bounding boxes with confidence-based coloring, and lets users remove or edit entries before exporting to CSV."
         data-de="Dieses Projekt ist eine Desktop-Pipeline zur Erfassung und Bereinigung von Namensdaten aus Klingelschild-Fotos (z. B. Hauseingänge, Briefkastenanlagen). Es lädt Bilder von Namensschildern, führt OCR (EasyOCR) zur Erkennung von Bewohnernamen durch, zeigt Ergebnisse als Bounding Boxes mit konfidenzbasierter Einfärbung und ermöglicht das Entfernen oder Bearbeiten von Einträgen vor dem CSV-Export."></p>
      <p data-en="The pipeline supports batch scanning, magnification for detail inspection, and separate CSV outputs for saved results and deleted entries. It is implemented in <strong>Python</strong> with <strong>OpenCV</strong>, <strong>EasyOCR</strong>, and <strong>Pandas</strong>, and is categorized under <strong>Computer Vision</strong>."
         data-de="Die Pipeline unterstützt Stapel-Scans, Vergrößerung zur Detailprüfung und getrennte CSV-Ausgaben für gespeicherte Ergebnisse und gelöschte Einträge. Sie ist in <strong>Python</strong> mit <strong>OpenCV</strong>, <strong>EasyOCR</strong> und <strong>Pandas</strong> umgesetzt und wird unter <strong>Computer Vision</strong> eingeordnet."></p>
    </section>

    <section>
      <h2 data-en="Tech Stack" data-de="Technologie-Stack"></h2>
      <ul>
        <li data-en="<strong>Python</strong> with OpenCV for image loading and drawing"
            data-de="<strong>Python</strong> mit OpenCV für Bildladen und -zeichnen"></li>
        <li data-en="<strong>EasyOCR</strong> for text detection (e.g. German names) on nameplate images"
            data-de="<strong>EasyOCR</strong> für Texterkennung (z. B. deutsche Namen) auf Namensschild-Bildern"></li>
        <li data-en="<strong>Pandas</strong> for CSV read/write and table handling (bbox, names, confidence)"
            data-de="<strong>Pandas</strong> für CSV-Lesen/Schreiben und Tabellenverwaltung (bbox, Namen, Konfidenz)"></li>
        <li data-en="<strong>PyQt5</strong> desktop GUI for image display, boxes, and CSV editing"
            data-de="<strong>PyQt5</strong>-Desktop-GUI für Bildanzeige, Boxen und CSV-Bearbeitung"></li>
      </ul>
    </section>

    <section>
      <h2 data-en="Key Features" data-de="Hauptmerkmale"></h2>

      <h3 data-en="Workspace &amp; Batch Scanning" data-de="Arbeitsplatz &amp; Stapel-Scan"></h3>
      <p data-en="Select a single image or a whole folder. The image list flags which photos already have a CSV (red = not yet scanned), and <strong>batch scanning</strong> runs OCR over every image in one go. The results table shows each detection with its bounding box, recognized name, confidence and source image."
         data-de="Einzelbild oder ganzen Ordner auswählen. Die Bildliste markiert, welche Fotos bereits eine CSV haben (rot = noch nicht gescannt), und der <strong>Stapel-Scan</strong> führt OCR über alle Bilder in einem Durchgang aus. Die Ergebnistabelle zeigt jede Erkennung mit Bounding Box, erkanntem Namen, Konfidenz und Quellbild."></p>
      <div class="gallery gallery--two">
        <figure class="screenshot">
          <a href="images/projects/doorbell_name_data/doorbell_csv_export.jpg" target="_blank" rel="noopener"><img src="images/projects/doorbell_name_data/doorbell_csv_export.jpg" alt="Workspace with OCR results table and image list" /></a>
          <figcaption data-en="Workspace: OCR results (box, name, confidence) and image list with CSV status" data-de="Arbeitsplatz: OCR-Ergebnisse (Box, Name, Konfidenz) und Bildliste mit CSV-Status"></figcaption>
        </figure>
      </div>

      <h3 data-en="OCR with Confidence-Coded Boxes" data-de="OCR mit konfidenzbasierten Boxen"></h3>
      <p data-en="<strong>EasyOCR</strong> (German, GPU-accelerated) detects the text on each nameplate. Every detection is drawn as a bounding box colored by confidence: green at or above the threshold, blue below it, so uncertain readings stand out at a glance."
         data-de="<strong>EasyOCR</strong> (Deutsch, GPU-beschleunigt) erkennt den Text auf jedem Namensschild. Jede Erkennung wird als Bounding Box nach Konfidenz eingefärbt: grün ab dem Schwellwert, blau darunter, sodass unsichere Ergebnisse sofort auffallen."></p>
      <div class="gallery gallery--two">
        <figure class="screenshot">
          <a href="images/projects/doorbell_name_data/doorbell_confidence_colors.jpg" target="_blank" rel="noopener"><img src="images/projects/doorbell_name_data/doorbell_confidence_colors.jpg" alt="OCR scan with confidence-coded bounding boxes" /></a>
          <figcaption data-en="OCR scan with confidence-coded boxes (green = high, blue = low confidence)" data-de="OCR-Scan mit konfidenzbasierten Boxen (grün = hohe, blau = niedrige Konfidenz)"></figcaption>
        </figure>
      </div>

      <h3 data-en="Click-to-Remove Cleaning" data-de="Bereinigung per Klick"></h3>
      <p data-en="In <strong>remove-name mode</strong> a wrong detection is deleted by clicking its box on the image. The entry disappears from the name list and is written to a separate “delete” CSV, and the removal can be undone."
         data-de="Im <strong>Namen-entfernen-Modus</strong> wird eine falsche Erkennung per Klick auf ihre Box im Bild gelöscht. Der Eintrag verschwindet aus der Namensliste, wird in eine separate „Löschen“-CSV geschrieben und kann rückgängig gemacht werden."></p>
      <div class="gallery gallery--two">
        <figure class="screenshot">
          <a href="images/projects/doorbell_name_data/doorbell_remove_name.jpg" target="_blank" rel="noopener"><img src="images/projects/doorbell_name_data/doorbell_remove_name.jpg" alt="Remove-name mode: misread entry deleted by clicking its box" /></a>
          <figcaption data-en="Remove-name mode: a misread entry is deleted by clicking its box" data-de="Namen-entfernen-Modus: ein falsch gelesener Eintrag wird per Klick auf die Box gelöscht"></figcaption>
        </figure>
      </div>

      <h3 data-en="Magnification for Detail Checks" data-de="Lupe zur Detailprüfung"></h3>
      <p data-en="<strong>Magnify mode</strong> shows a zoomed view of the area under the cursor, making it easy to verify small or blurry nameplate text before accepting or removing a detection."
         data-de="Der <strong>Lupenmodus</strong> zeigt eine vergrößerte Ansicht des Bereichs unter dem Mauszeiger, um kleine oder unscharfe Klingelschild-Texte vor dem Übernehmen oder Entfernen zu prüfen."></p>
      <div class="gallery gallery--two">
        <figure class="screenshot">
          <a href="images/projects/doorbell_name_data/doorbell_magnifier.jpg" target="_blank" rel="noopener"><img src="images/projects/doorbell_name_data/doorbell_magnifier.jpg" alt="Magnify mode for checking small nameplate text" /></a>
          <figcaption data-en="Magnify mode for checking small nameplate text" data-de="Lupenmodus zum Prüfen kleiner Klingelschild-Texte"></figcaption>
        </figure>
      </div>

    </section>
